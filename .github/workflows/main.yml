name: Ruby

on:
  push:
    branches:
      - '**'

  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        ruby:
          # Minor versions select the latest patch available on the runner.
          - '3.2' # Keep testing the minimum supported by fatty.gemspec.
          - '3.3'
          - '3.4'
          - '4.0'
          # Add '4.1' here once stable; ruby-head provides early coverage.

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve dependencies for each Ruby version
        # The development lockfile can contain gems requiring a newer Ruby.
        shell: bash
        run: rm -f Gemfile.lock
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run specs
        run: bundle exec rake spec

  lint:
    runs-on: ubuntu-latest
    name: RuboCop (locked dependencies)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          # Keep Gemfile.lock so CI uses the same lint rules as local Bundler.
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop

  ruby-head:
    name: Ruby head (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve dependencies for Ruby head
        run: rm -f Gemfile.lock
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-head
          bundler-cache: true
      - name: Run specs
        run: bundle exec rake spec
