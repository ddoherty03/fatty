name: mono
inherit: null
markdown_code_theme: github_dark

output:
  fg: "#d7d7d7"
  bg: "#000000"

input:
  fg: "#ffffff"
  bg: "#262626"
  attrs: [bold]

input_suggestion:
  fg: "#808080"
  bg: "#262626"
  attrs: [dim]

cursor:
  fg: "#000000"
  bg: "#ffffff"

region:
  fg: "#000000"
  bg: "#d7d7d7"

good:
  fg: "#1f9333"
  attrs: [bold]

info:
  fg: "#2d80d2"

warn:
  fg: "#977a20"
  attrs: [underline]

error:
  fg: "#d94a4a"
  attrs: [bold, underline]

pager_status:
  fg: "#000000"
  bg: "#d7d7d7"
  attrs: [bold]

search_input:
  fg: "#000000"
  bg: "#ffffff"

match_current:
  fg: "#000000"
  bg: "#ffffff"
  attrs: [bold]

match_other:
  fg: "#ffffff"
  bg: "#5f5f5f"

popup:
  fg: "#d7d7d7"
  bg: "#262626"

popup_input:
  fg: "#ffffff"
  bg: "#000000"
  attrs: [bold]

popup_counts:
  fg: "#000000"
  bg: "#d7d7d7"
  attrs: [bold]

popup_selection:
  fg: "#000000"
  bg: "#ffffff"

popup_frame:
  fg: "#d7d7d7"
  bg: "#262626"
  border: single
  corners: square

markdown_h1:
  fg: "#ffffff"
  bg: "#000000"
  attrs: [bold]

markdown_h2:
  fg: "#ffffff"
  bg: "#000000"
  attrs: [bold]

markdown_h3:
  fg: "#d7d7d7"
  bg: "#000000"
  attrs: [bold]

markdown_code:
  fg: "#ffffff"
  bg: "#262626"

markdown_code_gutter:
  fg: "#808080"
  bg: "#262626"
  attrs: [dim]

markdown_strong:
  fg: "#ffffff"
  bg: "#000000"
  attrs: [bold]

markdown_emphasis:
  fg: "#d7d7d7"
  bg: "#000000"
  attrs: [italic]

markdown_link:
  fg: "#ffffff"
  bg: "#000000"
  attrs: [underline]

markdown_url:
  fg: "#d7d7d7"
  bg: "#000000"
  attrs: [underline]

markdown_quote_gutter:
  fg: "#808080"
  bg: "#000000"

markdown_highlight:
  fg: "#000000"
  bg: "#ffffff"

markdown_table_header:
  fg: "#ffffff"
  bg: "#262626"
  attrs: [bold]

markdown_hrule:
  fg: "#808080"
  bg: "#000000"
  attrs: [dim]
